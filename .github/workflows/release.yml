name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    name: Tag matches manifest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # HACS compares installed and released versions, so these must agree.
      - run: |
          manifest=$(jq -r .version custom_components/user_directory/manifest.json)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::Release $GITHUB_REF_NAME doesn't match manifest version $manifest"
            exit 1
          fi
